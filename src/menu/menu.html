<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f1f1f;
        --muted: #8a8a8a;
        --hover: #ececec;
        --line: #e3e3e3;
        --border: rgba(0, 0, 0, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2b2b2b;
          --fg: #f0f0f0;
          --muted: #8c8c8c;
          --hover: #3d3d3d;
          --line: #404040;
          --border: rgba(255, 255, 255, 0.1);
        }
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      /* Room around the menu for its shadow; the view is positioned to compensate. */
      body {
        padding: 8px 12px 16px 8px;
        display: inline-block;
      }
      #menu {
        min-width: 180px;
        padding: 4px;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
        font: 13px system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      button {
        all: unset;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 6px 10px;
        border-radius: 5px;
        white-space: nowrap;
        cursor: default;
      }
      button:not(:disabled):hover,
      button:focus-visible {
        background: var(--hover);
      }
      button:disabled {
        color: var(--muted);
      }
      .nav {
        display: flex;
        gap: 2px;
      }
      .nav button {
        width: auto;
      }
      .icon {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .text-only {
        padding-left: 36px;
      }
      hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 4px 6px;
      }
    </style>
  </head>
  <body>
    <div id="menu" role="menu"></div>
    <script src="menu.js"></script>
  </body>
</html>
